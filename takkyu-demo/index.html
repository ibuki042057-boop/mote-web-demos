<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>卓球HOUSEアラキ｜ご提案用デモ</title><style>
:root{--ink:#20292c;--paper:#f4f3ee;--panel:#eceae2;--line:#d3d1c6;--muted:#565d5a}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;line-height:1.85;-webkit-text-size-adjust:100%}
a{color:inherit}
.notice{background:var(--panel);padding:10px 20px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line)}
.wrap{max-width:760px;margin:0 auto;padding:0 20px}
header{padding:32px 0 24px;border-bottom:1px solid var(--line)}
header .name{font-size:22px;font-weight:700;letter-spacing:.02em}
header .sub{font-size:13px;color:var(--muted);margin-top:8px}
main{padding:8px 0 24px}
section{padding:28px 0;border-bottom:1px solid var(--line)}
section:last-of-type{border-bottom:0}
h2{font-size:19px;font-weight:700;line-height:1.5;margin:0 0 14px}
h3{font-size:15px;font-weight:700;margin:0 0 6px}
p{margin:0 0 14px;font-size:15px}
.muted{color:var(--muted);font-size:13px}
ul{margin:0 0 14px;padding-left:1.2em}
li{margin:4px 0;font-size:15px}
.dl{margin:0}
.dl div{display:flex;gap:14px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.dl div:last-child{border-bottom:0}
.dl dt{flex:0 0 7.5em;color:var(--muted);margin:0}
.dl dd{margin:0}
.notes{list-style:none;padding:0;margin:0}
.notes li{font-size:13px;color:var(--muted);border-left:3px solid var(--line);padding:4px 0 4px 14px;margin:0 0 10px}
footer{padding:24px 0 48px;font-size:12px;color:var(--muted);line-height:1.8}
a:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
@media(max-width:600px){.dl div{display:block}.dl dt{margin-bottom:2px}}

h1.name{margin:0;line-height:1.5}body{overflow-wrap:anywhere}footer p{font-size:12px;margin:0 0 6px}
</style></head>

</div></body></html>
